services:
  testsite:
    build: ./testsite
    networks:
      - redteam-net

  collector:
    build: ./collector
    environment:
      COLLECTOR_TOKEN: "${COLLECTOR_TOKEN:-redteam-local-dev-token}"
    volumes:
      - ./collector-data:/data
    networks:
      - redteam-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  agent:
    build: ./agent
    environment:
      SKILL_ENDPOINT_RESEARCHER: "http://llm-proxy:8177/v1"
      SKILL_MODEL_RESEARCHER: "qwen3.5:9b"
    networks:
      - redteam-net
    depends_on:
      - testsite
      - collector

  llm-proxy:
    image: alpine/socat
    command: "TCP-LISTEN:8177,fork,reuseaddr TCP:host.docker.internal:11434"
    networks:
      - redteam-net
      - llm-bridge-net

networks:
  redteam-net:
    internal: true
  llm-bridge-net: {}
